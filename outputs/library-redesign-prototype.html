<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文库与图谱 · 重设计原型</title>
<style>
/* ============ 设计 token —— 逐项照抄 apps/web/src/index.css ============ */
:root{
  --bg-primary:#ffffff; --bg-secondary:#f7f7f8; --bg-tertiary:#ececed; --bg-elevated:#ffffff;
  --bg-hover:#e8e8e8;
  --border-subtle:rgba(0,0,0,.06); --border-default:rgba(0,0,0,.1); --border-strong:rgba(0,0,0,.16);
  --text-primary:#1a1a1c; --text-secondary:#525257; --text-tertiary:#8b8b92; --text-muted:#b0b0b5;
  --accent:#555555; --accent-light:#666666; --accent-dim:rgba(85,85,85,.08); --accent-glow:rgba(85,85,85,.15);
  --chip-active-bg:#d9d9db; --chip-active-fg:#1a1a1c;
  --danger:#dc2626; --warning:#d97706; --success:#16a34a;
  --candidate:#d97706; --candidate-soft:rgba(217,119,6,.12);
  --font-body:'Geist',system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-serif:'Crimson Pro',Georgia,'Songti SC','STSong','SimSun','Noto Serif SC',serif;
  --font-mono:'DM Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px;
  --duration-fast:120ms; --duration-normal:200ms; --duration-slow:350ms;
  --ease-out:cubic-bezier(0,0,.2,1); --ease-spring:cubic-bezier(.16,1,.3,1);
  --sidebar-width:260px;
  --shadow-pop:0 8px 28px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.08);
}
[data-theme='dark']{
  --bg-primary:#212121; --bg-secondary:#171717; --bg-tertiary:#2a2a2a; --bg-elevated:#2e2e2e;
  --bg-hover:#333333;
  --border-subtle:rgba(255,255,255,.05); --border-default:rgba(255,255,255,.1); --border-strong:rgba(255,255,255,.15);
  --text-primary:#ececf1; --text-secondary:#a1a1aa; --text-tertiary:#71717a; --text-muted:#52525b;
  --accent:#aaaaaa; --accent-light:#cccccc; --accent-dim:rgba(170,170,170,.1); --accent-glow:rgba(170,170,170,.2);
  --chip-active-bg:#4a4a4d; --chip-active-fg:#ececf1;
  --danger:#ef4444; --warning:#f59e0b; --success:#22c55e;
  --candidate:#f59e0b; --candidate-soft:rgba(245,158,11,.14);
  --shadow-pop:0 8px 28px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
}
/* ============ 基础 ============ */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-secondary);color:var(--text-primary);font-family:var(--font-body);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;text-align:left}
input{font-family:inherit}
.mono{font-family:var(--font-mono);font-size:12px}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:3px solid transparent;background-clip:content-box}
/* ============ 外壳 ============ */
.app{display:flex;height:100vh;overflow:hidden}
.main{flex:1;min-width:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;position:relative;background:var(--bg-primary)}
.dirview{height:100%;display:flex;flex-direction:column;min-height:0}
/* ============ 侧栏（照截图与 Sidebar.jsx） ============ */
.sidebar{display:flex;flex-direction:column;height:100vh;background:var(--bg-secondary);border-right:1px solid var(--border-subtle);flex-shrink:0;width:var(--sidebar-width);overflow:hidden}
.sb-header{padding:12px;border-bottom:1px solid var(--border-subtle);flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:8px;min-height:36px}
.sb-logo-mark{display:flex;align-items:center;justify-content:center;width:22px;height:22px;color:var(--text-primary)}
.sb-logo-mark svg{width:100%;height:100%}
.sb-logo-name{font-size:.9rem;font-weight:600;color:#3d3d44;letter-spacing:.02em;white-space:nowrap;line-height:1}
[data-theme='dark'] .sb-logo-name{color:#cfcfd6}
.sb-new{display:flex;align-items:center;gap:10px;margin:10px 8px 2px;padding:9px 12px;border-radius:var(--radius-md);background:var(--bg-tertiary);color:var(--text-primary);font-size:.875rem;font-weight:500;cursor:pointer;transition:background var(--duration-fast)}
.sb-new:hover{background:var(--bg-hover)}
.sb-new svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.75;fill:none;flex:0 0 auto}
.sb-nav{display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-bottom:1px solid var(--border-subtle);flex-shrink:0}
.sb-item{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--radius-md);color:#3d3d44;font-size:.875rem;font-weight:500;cursor:pointer;transition:all var(--duration-fast);white-space:nowrap;position:relative;text-align:left}
[data-theme='dark'] .sb-item{color:#cfcfd6}
.sb-item:hover{color:var(--text-primary);background:var(--bg-hover)}
.sb-item.is-active{font-weight:600;background:var(--bg-hover)}
.sb-item svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.75;fill:none;flex:0 0 auto}
.sb-sec{padding:16px 16px 6px;font-size:.7rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.sb-sessions{flex:1;overflow-y:auto;padding:0 8px 8px}
.sb-hist{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-md);cursor:pointer;margin-bottom:2px;position:relative;transition:all var(--duration-fast)}
.sb-hist:hover{background:var(--bg-hover)}
.sb-hist.is-active{background:var(--bg-tertiary)}
.sb-hist.is-active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:60%;background:var(--accent);border-radius:0 2px 2px 0}
.sb-hist-icon{color:var(--text-secondary);display:flex;flex:0 0 auto}
.sb-hist-icon svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.75;fill:none}
.sb-hist-t{font-size:.825rem;font-weight:500;color:#3d3d44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;display:block}
[data-theme='dark'] .sb-hist-t{color:#cfcfd6}
.sb-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border-subtle);flex-shrink:0;margin-top:auto}
.sb-foot-l{display:flex;align-items:center;gap:8px;min-width:0}
.sb-foot-l span{font-size:.7rem;color:var(--text-muted);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;flex:0 0 auto}
.dot.is-down{background:var(--danger)}
.sb-theme{width:26px;height:26px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);cursor:pointer}
.sb-theme:hover{background:var(--bg-hover)}
.sb-theme svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.75;fill:none}
/* ============ 评审控制条（外壳，独立前缀） ============ */
.review-bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;width:max-content;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:4px;padding:6px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:14px;box-shadow:var(--shadow-pop)}
.rv-btn{padding:6px 13px;border-radius:9px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;white-space:nowrap;transition:all var(--duration-fast)}
.rv-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.rv-btn.is-on{background:var(--text-primary);color:var(--bg-primary);font-weight:600}
.rv-sep{width:1px;height:18px;background:var(--border-default);margin:0 4px;flex:0 0 auto}
.rv-cost{font-size:10.5px;color:var(--text-tertiary);padding:0 10px 0 6px;max-width:300px;white-space:normal;line-height:1.45}
.rv-key{display:inline-block;padding:0 4px;border:1px solid var(--border-default);border-radius:4px;font-size:9.5px;line-height:1.5;margin-right:4px;vertical-align:1px}
/* ============ 共享：chip / 行 / 徽标 ============ */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border:1px solid var(--border-subtle);border-radius:999px;background:var(--bg-primary);font-size:11px;color:var(--text-secondary);white-space:nowrap}
.chip.is-cand{color:var(--candidate);border-color:var(--candidate-soft);background:var(--candidate-soft)}
.badge{padding:1px 7px;border-radius:999px;background:var(--bg-tertiary);font-size:10px;color:var(--text-tertiary);white-space:nowrap}
.paper-row{display:flex;align-items:flex-start;gap:12px;padding:13px 20px;cursor:pointer;border-bottom:1px solid var(--border-subtle);transition:background var(--duration-fast);position:relative}
.paper-row:hover{background:var(--bg-secondary)}
.paper-row.is-active{background:var(--accent-dim)}
.paper-row.is-active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--text-primary)}
.pr-main{flex:1;min-width:0}
.pr-title{font-size:13.5px;font-weight:500;line-height:1.45;color:var(--text-primary);display:block}
.pr-meta{margin-top:3px;font-size:11.5px;color:var(--text-tertiary);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pr-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;padding-top:2px}
.ev-chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border:1px solid var(--border-subtle);border-radius:999px;font-size:10.5px;color:var(--text-secondary);cursor:pointer;background:var(--bg-primary);transition:all var(--duration-fast)}
.ev-chip:hover{border-color:var(--border-strong);color:var(--text-primary)}
.seg{display:flex;background:var(--bg-tertiary);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:3px 12px;border-radius:999px;font-size:12px;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.seg button.is-on{background:var(--bg-primary);color:var(--text-primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.icon-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--radius-md);color:var(--text-tertiary);cursor:pointer}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.7;fill:none}
/* popover（ⓘ 与筛选共用） */
.pop{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:340px;max-width:calc(100vw - 320px);background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);padding:14px 16px}
.pop h4{margin:0 0 6px;font-size:12.5px;font-weight:600}
.pop .kv{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;font-size:12px;margin:8px 0}
.pop .kv .k{color:var(--text-tertiary)}
.pop ul{margin:8px 0 0;padding-left:16px;font-size:11.5px;color:var(--text-secondary)}
.pop li{margin:4px 0}
.pop .idfull{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);word-break:break-all;background:var(--bg-secondary);border-radius:6px;padding:6px 8px;display:block}
/* 抽屉（A 方向详情 + 证据共用） */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:44}
.drawer{position:fixed;top:0;right:0;height:100%;width:480px;max-width:94vw;background:var(--bg-primary);border-left:1px solid var(--border-subtle);transform:translateX(103%);transition:transform .24s var(--ease-out);z-index:45;display:flex;flex-direction:column}
body.is-drawer .mask{opacity:1;pointer-events:auto}
body.is-drawer .drawer{transform:none}
.dw-tabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--border-subtle);padding:10px 18px 0;flex-shrink:0}
.dw-tabs button{padding:6px 12px;font-size:12.5px;border-bottom:2px solid transparent;color:var(--text-tertiary);cursor:pointer}
.dw-tabs button.is-on{border-bottom-color:var(--text-primary);color:var(--text-primary);font-weight:600}
.dw-body{flex:1;overflow-y:auto;padding:16px 18px 90px}
/* 详情（抽屉 / C 详情卡共用） */
.dt-title{font-size:15px;font-weight:600;line-height:1.5;margin:0 0 4px}
.dt-id{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);word-break:break-all}
.dt-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.dt-links a{font-size:11px;color:var(--accent);text-decoration:underline;cursor:pointer}
.dt-sec{margin-top:16px}
.dt-sec h3{margin:0 0 7px;font-size:12px;font-weight:600;color:var(--text-primary)}
.dt-sec .hint{margin:-4px 0 7px;font-size:10.5px;color:var(--text-tertiary);line-height:1.5}
.dt-auth{display:flex;align-items:center;gap:7px;font-size:12px;padding:2.5px 0;flex-wrap:wrap}
.dt-chips{display:flex;flex-wrap:wrap;gap:5px}
.dt-assert{border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:8px 10px;margin-bottom:7px;font-size:12px;background:var(--bg-secondary)}
.dt-assert .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dt-assert .pred{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}
.dt-assert .score{margin-left:auto;font-size:10.5px;color:var(--text-tertiary)}
.dt-assert .ev{margin-top:5px}
.dt-cite{font-family:var(--font-mono);font-size:10.5px;line-height:1.6;color:var(--text-tertiary);word-break:break-word}
.dt-notice{margin-top:14px;border:1px solid var(--border-subtle);border-left:2px solid var(--warning);border-radius:var(--radius-md);padding:8px 11px;font-size:11px;color:var(--text-secondary);line-height:1.6;background:var(--bg-secondary)}
/* 图谱 */
.g-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.g-nodeinfo{margin-top:8px;font-size:11.5px;color:var(--text-secondary);background:var(--bg-secondary);border-radius:var(--radius-md);padding:6px 12px;max-width:90%;text-align:center}
.g-paths{margin-top:10px;width:100%;max-width:640px}
.g-paths summary{cursor:pointer;font-size:11.5px;color:var(--text-tertiary)}
.g-path{font-size:11.5px;color:var(--text-secondary);padding:4px 0;border-top:1px dashed var(--border-subtle)}
.g-pred{font-family:var(--font-mono);font-size:10.5px;color:var(--accent)}
/* ============ 现状复刻（baseline） ============ */
.bl-top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--bg-primary);border-bottom:1px solid var(--border-subtle);font-size:12.5px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;flex-shrink:0;min-height:37px}
.bl-top .crumb{color:var(--text-primary);font-weight:600;font-size:13px;flex:0 0 auto}
.bl-top code{font-family:var(--font-mono);font-size:11.5px;color:var(--text-primary)}
.bl-body{display:flex;flex:1;min-height:0}
.bl-left{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--border-subtle)}
.bl-form{border-bottom:1px solid var(--border-subtle);background:var(--bg-primary);padding:12px 20px 10px;flex-shrink:0}
.bl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.bl-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.bl-f span{font-size:11px;color:var(--text-tertiary)}
.bl-f input{height:32px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-primary);padding:0 8px;font-size:13px;color:var(--text-primary);outline:none;min-width:0}
.bl-f input:focus{border-color:var(--accent)}
.bl-act{display:flex;align-items:center;gap:12px;margin-top:12px}
.bl-go{height:32px;padding:0 16px;border-radius:var(--radius-md);background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;flex:0 0 auto}
.bl-note{font-size:11px;color:var(--text-tertiary)}
.bl-echo{border-bottom:1px solid var(--border-subtle);background:var(--bg-secondary);padding:7px 20px;font-size:11px;color:var(--text-tertiary);line-height:1.7;flex-shrink:0}
.bl-echo code{font-family:var(--font-mono);font-size:10.5px;background:var(--bg-primary);padding:1px 6px;border-radius:4px;color:var(--text-secondary)}
.bl-notice{margin:12px 20px;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-primary);padding:9px 14px;font-size:12px;color:var(--text-secondary);flex-shrink:0}
.bl-notice summary{cursor:pointer;font-size:12px}
.bl-notice ul{margin:8px 0 0;padding-left:20px}
.bl-notice li{margin:3px 0;font-size:11.5px}
.bl-stage{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.bl-empty{margin:auto;padding:30px 20px;text-align:center;font-size:13px;color:var(--text-tertiary)}
.bl-aside{width:480px;flex:0 0 auto;display:flex;flex-direction:column;background:var(--bg-secondary);min-width:0}
.bl-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-subtle);background:var(--bg-primary);padding:8px 16px 0;flex-shrink:0}
.bl-tabs button{padding:6px 12px;font-size:12.5px;border-bottom:2px solid transparent;color:var(--text-tertiary);cursor:pointer}
.bl-tabs button.is-on{border-bottom-color:var(--text-primary);color:var(--text-primary);font-weight:600}
.bl-list{list-style:none;margin:0;padding:0;overflow-y:auto}
.bl-list li{border-bottom:1px solid var(--border-subtle)}
.bl-li{width:100%;padding:12px 20px;cursor:pointer;display:block}
.bl-li:hover{background:var(--bg-secondary)}
.bl-li.is-active{background:var(--accent-dim)}
.bl-li .t{font-size:13px;font-weight:500;line-height:1.45}
.bl-li .id{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);margin-top:2px}
.bl-li .badges{margin-top:6px;display:flex;gap:6px;align-items:center}
/* ============ A：检索优先 ============ */
.a-top{display:flex;align-items:center;gap:10px;padding:0 20px;height:46px;border-bottom:1px solid var(--border-subtle);background:var(--bg-primary);flex-shrink:0;position:relative;z-index:31}
.a-crumb{font-size:13.5px;font-weight:600}
.a-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-tertiary)}
.a-hero{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.a-hero-inner{margin:auto;width:100%;max-width:760px;padding:40px 32px 110px;display:flex;flex-direction:column;align-items:center;text-align:center}
.a-title{font-family:var(--font-serif);font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.25;margin:0}
.a-sub{margin:10px 0 0;font-size:13px;color:var(--text-secondary);line-height:1.8}
.a-sub b{color:var(--text-primary);font-weight:600}
.a-search{display:flex;gap:8px;width:100%;max-width:620px;margin-top:26px;position:relative}
.a-input{flex:1;height:46px;border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--bg-elevated);padding:0 14px 0 40px;font-size:14px;color:var(--text-primary);outline:none;min-width:0;transition:border-color var(--duration-fast),box-shadow var(--duration-fast)}
.a-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.a-input::placeholder{color:var(--text-muted)}
.a-ico{position:absolute;left:14px;top:15px;color:var(--text-muted);pointer-events:none}
.a-ico svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none}
.a-btn{height:46px;padding:0 18px;border-radius:var(--radius-lg);border:1px solid var(--border-default);background:var(--bg-elevated);font-size:13px;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:6px;flex:0 0 auto;position:relative;transition:all var(--duration-fast)}
.a-btn:hover{border-color:var(--border-strong);color:var(--text-primary)}
.a-btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none}
.a-btn .n{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:999px;background:var(--text-primary);color:var(--bg-primary);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.a-go{height:46px;padding:0 22px;border-radius:var(--radius-lg);background:var(--text-primary);color:var(--bg-primary);font-size:13.5px;font-weight:600;cursor:pointer;flex:0 0 auto}
.a-fpop{position:absolute;top:calc(100% + 8px);right:0;z-index:30;width:380px;text-align:left}
.a-fpop .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.a-fpop .f{display:flex;flex-direction:column;gap:4px}
.a-fpop .f span{font-size:11px;color:var(--text-tertiary)}

.b-top .pop{right:0;top:calc(100% + 4px)}

/* toast */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:var(--bg-primary);font-size:12px;padding:8px 16px;border-radius:999px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;width:max-content;max-width:80vw;text-align:center}

  h += '<div class="dt-notice">候选断言不是已核实事实；引用前请阅读原文。</div>';
  return h;
}
/* 环形图谱 SVG */
function graphSvg(g, size) {
  size = size || 480;
  var c = size / 2, R = c - 66;
  var others = g.nodes.filter(function (n) { return n.id !== g.rootId; });
  var pos = {}; pos[g.rootId] = [c, c];
  others.forEach(function (n, i) {
    var ang = (i / Math.max(others.length, 1)) * Math.PI * 2 - Math.PI / 2;
    pos[n.id] = [c + R * Math.cos(ang), c + R * Math.sin(ang)];
  });
  var h = '<svg viewBox="0 0 ' + size + ' ' + size + '" style="width:100%;max-width:' + (size + 60) + 'px;height:auto" role="img" aria-label="局部知识图谱">';
  g.edges.forEach(function (e) {
    var a = pos[e.source], b = pos[e.target]; if (!a || !b) return;
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
    var r1 = e.source === g.rootId ? 27 : 17, r2 = e.target === g.rootId ? 27 : 17;
    var x1 = a[0] + dx * r1 / L, y1 = a[1] + dy * r1 / L, x2 = b[0] - dx * (r2 + 7) / L, y2 = b[1] - dy * (r2 + 7) / L;
    h += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--border-strong)" stroke-width="1.3"/>';
    h += '<text x="' + ((x1 + x2) / 2).toFixed(1) + '" y="' + ((y1 + y2) / 2 - 4).toFixed(1) + '" text-anchor="middle" font-size="9.5" fill="var(--text-tertiary)" font-family="var(--font-mono)">' + esc(e.kind) + (e.cand ? '（候选）' : '') + '</text>';
  });
  g.nodes.forEach(function (n) {
    var p = pos[n.id]; if (!p) return;
    var isRoot = n.id === g.rootId, r = isRoot ? 26 : 16;
    var label = (n.name.length > 15 ? n.name.slice(0, 14) + '…' : n.name);
    h += '<g data-act="g-node" data-node="' + n.id + '" style="cursor:pointer">' +
      '<title>' + KIND_ZH[n.kind] + '：' + esc(n.name) + '</title>' +
      '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + r + '" fill="' + (isRoot ? 'var(--text-primary)' : 'var(--bg-elevated)') + '" stroke="var(--border-strong)" stroke-width="' + (isRoot ? 0 : 1.2) + '"/>' +
      '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + 3.5).toFixed(1) + '" text-anchor="middle" font-size="' + (isRoot ? 10.5 : 9) + '" fill="' + (isRoot ? 'var(--bg-primary)' : 'var(--text-secondary)') + '">' + KIND_ZH[n.kind] + '</text>' +
      '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + r + 14).toFixed(1) + '" text-anchor="middle" font-size="10" fill="var(--text-secondary)">' + esc(label) + '</text>' +
      '</g>';
  });
  return h + '</svg>';
}

/* ================= 渲染入口 ================= */
function render() {
  document.documentElement.dataset.theme = S.theme;
  renderSidebar();
  renderBar();
  var v = { baseline: viewBaseline, A: viewA, B: viewB, C: viewC }[S.dir];
  $('#stage').innerHTML = v();
  $('#drawer').style.display = 'none';
  $('#mask').style.display = 'none';
}
/* A 方向的详情抽屉（独立于 render 全量重绘，直接开） */
function openDrawer(id) {
  S.selected = id; S.tab = 'detail';
  $('#dwTabs').innerHTML =
    '<button class="is-on" data-act="tab" data-tab="detail">论文详情</button>' +
    '<button data-act="tab" data-tab="graph">局部图谱</button>' +
    '<span class="mono" style="margin-left:auto;font-size:10px;color:var(--text-muted);padding-bottom:6px">' + esc(id) + '</span>' +
    '<button class="icon-btn" data-act="drawer-close" aria-label="关闭" style="margin-left:8px">' + svgIco(ICO.close) + '</button>';
  $('#dwBody').innerHTML = detailBodyHtml(true);
  $('#drawer').style.display = 'flex';
  $('#mask').style.display = 'block';
  document.body.classList.add('is-drawer');
}
function closeDrawer() {
  document.body.classList.remove('is-drawer');
  $('#drawer').style.display = 'none';
  $('#mask').style.display = 'none';
}
function openEvidence() {
  var e = MOCK.evidence, d = MOCK.detail;
  S.evDrawer = true;
  $('#dwTabs').innerHTML = '<button class="is-on">证据详情</button><button class="icon-btn" data-act="drawer-close" aria-label="关闭" style="margin-left:auto">' + svgIco(ICO.close) + '</button>';
  $('#dwBody').innerHTML =
    '<h2 class="dt-title" style="font-size:14px">' + esc(d.publication.title) + '</h2>' +
    '<div class="dt-id">' + esc(d.publication.id) + '</div>' +
    '<div class="dt-sec"><div class="kv" style="display:grid;grid-template-columns:76px 1fr;gap:8px 10px;font-size:12.5px">' +
    '<span style="color:var(--text-tertiary)">来源类型</span><span>' + e.label + '</span>' +
    '<span style="color:var(--text-tertiary)">证据深度</span><span>' + e.level + ' <span style="color:var(--warning)">（仅题名）</span></span>' +
    '<span style="color:var(--text-tertiary)">核验状态</span><span>' + e.ver + '</span>' +
    '<span style="color:var(--text-tertiary)">图谱版本</span><span class="mono" style="font-size:11px">' + esc(GRAPH_ID) + '</span></div></div>' +
    '<div class="dt-notice">' + esc(e.caveat) + '</div>' +
    '<div style="display:flex;gap:8px;margin-top:16px">' +
    '<button class="a-go" style="height:34px;font-size:12.5px" data-act="drawer-open-paper">查看论文详情</button>' +
    '<button class="a-btn" style="height:34px" data-act="noop">在 DBLP 打开来源</button></div>';
  $('#drawer').style.display = 'flex';
  $('#mask').style.display = 'block';
  document.body.classList.add('is-drawer');
}

/* ================= 事件分发 ================= */
function doSearch() {
  var qEl = $('#mainQ');
  if (qEl && qEl.value) S.q = qEl.value;
  S.searched = true; S.filtersOpen = false; S.infoOpen = false;
  if (!S.selected) S.selected = MOCK.papers[1].id;
  render();
  if (S.dir === 'A') openDrawer(S.selected);
}
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) {
    /* 点空白关闭 popover */
    if (S.filtersOpen || S.infoOpen) {
      if (!ev.target.closest('.pop')) { S.filtersOpen = false; S.infoOpen = false; render(); if (S.dir === 'A' && S.searched) openDrawerKeep(); }
    }
    return;
  }
  var act = el.dataset.act;
  if (act === 'dir') { S.dir = el.dataset.dir; S.filtersOpen = false; S.infoOpen = false; closeDrawer(); render(); return; }
  if (act === 'theme') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); return; }
  if (act === 'nav-agent') { toast('本轮原型聚焦「论文库与图谱」，科研助手视图未改动'); return; }
  if (act === 'new-research') { toast('本轮原型聚焦「论文库与图谱」'); return; }
  if (act === 'noop') { return; }
  if (act === 'info-toggle') { S.infoOpen = !S.infoOpen; S.filtersOpen = false; render(); return; }
  if (act === 'filters-toggle') {
    S.filtersOpen = !S.filtersOpen; S.infoOpen = false;
    if (!S.filters) S.filters = { method: '', task: '', dataset: '', author: '', venue: '', year: '', limit: '10' };
    render(); return;
  }
  if (act === 'filters-clear') { S.filters = null; S.filtersOpen = false; render(); return; }
  if (act === 'filter-remove') {
    if (S.filters) { S.filters[el.dataset.k] = ''; }
    render(); return;
  }
  if (act === 'suggest') { S.q = el.dataset.q; doSearch(); return; }
  if (act === 'search-submit') { doSearch(); return; }
  if (act === 'bl-search') { S.searched = true; render(); return; }
  if (act === 'paper-open') {
    var id = el.dataset.id;
    if (S.dir === 'A') { openDrawer(id); } else { S.selected = id; S.tab = 'detail'; render(); }
    return;
  }
  if (act === 'tab') { S.tab = el.dataset.tab; if (S.dir === 'A') { $('#dwTabs').innerHTML = ''; closeDrawer(); openDrawer(S.selected); S.tab = el.dataset.tab; $('#dwTabs').innerHTML = tabHtmlForDrawer(); $('#dwBody').innerHTML = drawerBodyForTab(); } else render(); return; }
  if (act === 'graph-mode') { S.graphMode = el.dataset.mode; render(); return; }
  if (act === 'drawer-close') { closeDrawer(); S.evDrawer = null; render(); return; }
  if (act === 'drawer-open-paper') { closeDrawer(); if (S.dir !== 'A') { S.selected = MOCK.detail.publication.id; render(); } else openDrawer(MOCK.detail.publication.id); return; }
  if (act === 'evidence-open') { openEvidence(); return; }
  if (act === 'g-node') {
    var nid = el.dataset.node;
    var n = MOCK.graph.nodes.filter(function (x) { return x.id === nid; })[0];
    var info = $('#gNodeInfo');
    if (n && info) info.textContent = KIND_ZH[n.kind] + '：' + n.name + ' · 属性来自真实 Neo4j';
    return;
  }
});
function tabHtmlForDrawer() {
  return '<button class="' + (S.tab === 'detail' ? 'is-on' : '') + '" data-act="tab" data-tab="detail">论文详情</button>' +
    '<button class="' + (S.tab === 'graph' ? 'is-on' : '') + '" data-act="tab" data-tab="graph">局部图谱</button>' +
    '<span class="mono" style="margin-left:auto;font-size:10px;color:var(--text-muted);padding-bottom:6px">' + esc(S.selected || '') + '</span>' +
    '<button class="icon-btn" data-act="drawer-close" aria-label="关闭" style="margin-left:8px">' + svgIco(ICO.close) + '</button>';
}
function drawerBodyForTab() {
  return S.tab === 'detail' ? detailBodyHtml(true) :
    '<div class="g-wrap">' + graphSvg(MOCK.graph, 420) + '<div class="g-nodeinfo">9 节点 · 8 关系 · 4 条路径（上限 30）· 真实 Neo4j</div></div>';
}
function openDrawerKeep() { if (S.dir === 'A' && S.searched && S.selected) openDrawer(S.selected); }
document.addEventListener('keydown', function (ev) {
  if (ev.target && /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) {
    if (ev.key === 'Enter' && ev.target.id === 'mainQ') { doSearch(); }
    if (ev.key === 'Escape') { ev.target.blur(); }
    return;
  }
  if (ev.key === '1') { S.dir = 'baseline'; closeDrawer(); render(); }
  if (ev.key === '2') { S.dir = 'A'; closeDrawer(); render(); }
  if (ev.key === '3') { S.dir = 'B'; closeDrawer(); render(); }
  if (ev.key === '4') { S.dir = 'C'; closeDrawer(); render(); }
  if (ev.key === 't' || ev.key === 'T') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); }
  if (ev.key === 'Escape') { closeDrawer(); if (S.filtersOpen || S.infoOpen) { S.filtersOpen = false; S.infoOpen = false; render(); } }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.matches('[data-filter]')) {
    if (!S.filters) S.filters = {};
    S.filters[t.dataset.filter] = t.value;
    render();
  }
});
/* 筛选面板输入不打断输入法：input 事件只记值不重绘，blur/change 落盘 */
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.matches && t.matches('[data-filter]') && S.filters) S.filters[t.dataset.filter] = t.value;
  if (t.id === 'mainQ') S.q = t.value;
});

/* ================= harness 钩子 ================= */
window.__proto = {
  setTheme: function (t) { S.theme = t; render(); },
  setDir: function (d) { S.dir = d; S.filtersOpen = false; S.infoOpen = false; closeDrawer(); render(); },
  search: function (q) { S.q = q || 'transformer'; S.searched = true; S.selected = MOCK.papers[1].id; render(); },
  reset: function () { S.searched = false; S.q = ''; S.selected = null; S.filters = null; S.filtersOpen = false; S.infoOpen = false; closeDrawer(); render(); },
  openDrawer: function (id) { S.searched = true; S.selected = id || MOCK.papers[1].id; if (S.dir !== 'A') S.dir = 'A'; render(); openDrawer(S.selected); },
  closeDrawer: closeDrawer,
  toggleFilters: function () { S.filtersOpen = !S.filtersOpen; if (S.filters) S.filters.method = S.filters.method || ''; if (!S.filters) S.filters = { method: '扩散模型', task: '', dataset: '', author: '', venue: '', year: '', limit: '10' }; render(); },
  toggleInfo: function () { S.infoOpen = !S.infoOpen; render(); },
  openEvidence: openEvidence,
  state: function () { return JSON.parse(JSON.stringify({ dir: S.dir, theme: S.theme, searched: S.searched, selected: S.selected, tab: S.tab, filtersOpen: S.filtersOpen, infoOpen: S.infoOpen })); }
};
render();
</script>
</body>
</html>
