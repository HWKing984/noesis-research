<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>noesis-research · 原文阅读 Paper Reader 设计原型</title>
<style>
/* ===== 设计 token：逐字取自 D:\a-Soft\frontend\src\index.css ===== */
:root{
  --bg-primary:#ffffff; --bg-secondary:#f7f7f8; --bg-tertiary:#ececed;
  --bg-surface:#e3e3e5; --bg-elevated:#ffffff; --bg-hover:#e8e8e8;
  --border-subtle:rgba(0,0,0,.06); --border-default:rgba(0,0,0,.1); --border-strong:rgba(0,0,0,.16);
  --text-primary:#1a1a1c; --text-secondary:#525257; --text-tertiary:#8b8b92; --text-muted:#b0b0b5;
  --accent:#555555; --accent-light:#666666; --accent-dim:rgba(85,85,85,.08); --accent-glow:rgba(85,85,85,.15);
  --chip-active-bg:#d9d9db; --chip-active-fg:#1a1a1c; --pill-bg:#f1f1f3;
  --user-bubble:#bae6fd; --user-text:#0c4a6e;
  --danger:#dc2626; --warning:#d97706; --success:#16a34a;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px;
  --font-body:'Geist',system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-serif:'Crimson Pro',Georgia,'Times New Roman',serif;
  --font-mono:'DM Mono','Cascadia Code',Consolas,Menlo,monospace;
  /* 阅读器功能色（低饱和，仅用于高亮/状态点） */
  --hl-bg:rgba(255,196,0,.32); --hl-user:rgba(85,140,220,.24);
  --sel-bg:rgba(96,125,180,.28);
  --paper:#ffffff; --paper-text:#26262a; --paper-meta:#7a7a80;
  --shadow-pop:0 8px 28px rgba(0,0,0,.14);
}
:root[data-theme="dark"]{
  --bg-primary:#212121; --bg-secondary:#171717; --bg-tertiary:#2a2a2a;
  --bg-surface:#2f2f2f; --bg-elevated:#2e2e2e; --bg-hover:#333333;
  --border-subtle:rgba(255,255,255,.05); --border-default:rgba(255,255,255,.1); --border-strong:rgba(255,255,255,.15);
  --text-primary:#ececf1; --text-secondary:#a1a1aa; --text-tertiary:#71717a; --text-muted:#52525b;
  --accent:#aaaaaa; --accent-light:#cccccc; --accent-dim:rgba(170,170,170,.1); --accent-glow:rgba(170,170,170,.2);
  --chip-active-bg:#4a4a4d; --chip-active-fg:#ececf1; --pill-bg:#2e2e2e;
  --user-bubble:#0c4a6e; --user-text:#e0f2fe;
  --danger:#ef4444; --warning:#f59e0b; --success:#22c55e;
  --hl-bg:rgba(255,196,0,.24); --hl-user:rgba(110,150,220,.26);
  --sel-bg:rgba(120,150,200,.30);
  --paper:#262628; --paper-text:#cfcfd4; --paper-meta:#8a8a90;
  --shadow-pop:0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
::selection{background:var(--sel-bg)}
html,body{height:100%}
body{font-family:var(--font-body);font-size:13px;color:var(--text-primary);background:var(--bg-secondary);overflow:hidden}
svg{flex:0 0 auto}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ic svg{width:15px;height:15px}
.ic-13 svg{width:13px;height:13px}
.ic-18 svg{width:18px;height:18px}
.ic-20 svg{width:20px;height:20px}

/* ===== 应用外壳 ===== */
#app{display:flex;height:100vh;padding-bottom:92px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}

/* ===== 侧栏（复刻 noesis-research/apps/web Sidebar：260px、螺线标、研究区、对话记录、Agent 状态） ===== */
#sidebar{width:260px;flex:0 0 260px;background:var(--bg-secondary);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:0 0 10px;overflow:hidden;--sidebar-text:#3d3d44}
:root[data-theme="dark"] #sidebar{--sidebar-text:#cfcfd6}
.sb-head{padding:12px;border-bottom:1px solid var(--border-subtle);flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:8px;min-height:36px}
.sb-logo-mark{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:22px;height:22px}
.sb-logo-mark svg{display:block;width:100%;height:100%;overflow:visible}
.sb-logo-name{font-size:.9rem;font-weight:600;color:var(--sidebar-text);letter-spacing:.22em;white-space:nowrap;line-height:1}
.sb-toggle{margin-left:auto;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:var(--radius-sm);color:var(--sidebar-text)}
.sb-toggle:hover{background:var(--bg-hover)}
.sb-toggle svg{width:15px;height:15px;stroke-width:1.75}
.sb-nav{display:flex;flex-direction:column;gap:2px;padding:12px 8px;border-bottom:1px solid var(--border-subtle);flex-shrink:0}
.sb-group-label{font-size:.7rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em;padding:4px 12px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:var(--radius-md);color:var(--sidebar-text);font-size:.875rem;font-weight:500;text-align:left}
.sb-item:hover{color:var(--text-primary);background:var(--bg-hover)}
.sb-item.is-active{color:var(--sidebar-text);font-weight:600;background:var(--bg-hover)}
.sb-item .ic svg{width:16px;height:16px}
.sb-sec{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px;flex-shrink:0}
.sb-sec-label{font-size:.75rem;font-weight:600;color:var(--text-secondary);letter-spacing:.02em}
.sb-new{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:var(--radius-sm);color:var(--sidebar-text)}
.sb-new:hover{color:var(--accent);background:var(--accent-dim)}
.sb-sessions{flex:1;overflow-y:auto;padding:0 8px 8px}
.sess{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--radius-md);text-align:left;position:relative;color:var(--text-secondary)}
.sess:hover{background:var(--bg-hover)}
.sess.is-active{background:var(--bg-tertiary)}
.sess-t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.sess-title{font-size:12.5px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:185px}
.sess-time{font-size:11px;color:var(--text-tertiary)}
.sb-foot{display:flex;align-items:center;gap:8px;padding:10px 12px 2px;border-top:1px solid var(--border-subtle);flex-shrink:0}
.sb-foot .who{font-size:12px;color:var(--text-tertiary);flex:1;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.sb-foot .dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex:0 0 auto}
.sb-theme{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:var(--radius-sm);color:var(--text-tertiary);flex:0 0 auto}
.sb-theme:hover{background:var(--bg-hover)}
/* chat-header 居中胶囊页签（对齐 noesis-research .mode-tabs） */
.ws-head{position:relative}
.mode-tabs{display:flex;background:var(--bg-tertiary);border-radius:999px;padding:3px;gap:2px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.mode-tabs button{padding:4px 14px;border-radius:999px;font-size:12px;color:var(--text-secondary);white-space:nowrap}
.mode-tabs button.is-on{background:var(--bg-primary);color:var(--text-primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ws-title{font-size:.875rem;font-weight:600;white-space:nowrap;flex:0 0 auto}
.ws-doc{font-size:12.5px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0;max-width:200px}

/* ===== 工作台公共 ===== */
.ws{height:100%;display:flex;flex-direction:column;background:var(--bg-primary)}
.ws-head{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border-subtle);min-height:54px}
.paper-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.head-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.ws-body{flex:1;min-height:0;display:flex}
.ws-body>*{min-width:0}

/* 徽章 / 胶囊 */
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2.5px 9px;border-radius:999px;border:1px solid var(--border-default);background:var(--pill-bg);color:var(--text-secondary);white-space:nowrap}
.st .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.st--ghost{border-style:dashed;color:var(--text-tertiary)}
.st--solid{background:var(--chip-active-bg);border-color:transparent;color:var(--chip-active-fg)}
.kg-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-tertiary);white-space:nowrap}
.kg-pill b{font-weight:500;color:var(--text-secondary)}
.sha{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 12px;border-radius:var(--radius-md);border:1px solid var(--border-default);color:var(--text-secondary);white-space:nowrap}
.btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn--ink{background:var(--text-primary);color:var(--bg-primary);border-color:transparent}
.btn--ink:hover{background:var(--text-primary);opacity:.88;color:var(--bg-primary)}

/* ===== 方向 A · 文献列表列 ===== */
.papers-col{width:270px;flex:0 0 270px;border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;background:var(--bg-secondary)}
.psearch{margin:10px 10px 6px;display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:var(--radius-md);background:var(--bg-primary);border:1px solid var(--border-default);color:var(--text-tertiary)}
.psearch input{flex:1;font-size:12.5px;color:var(--text-primary)}
.psearch kbd{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);border:1px solid var(--border-default);border-radius:4px;padding:1px 5px}
.plist{flex:1;overflow-y:auto;padding:4px 8px 12px}
.prow{width:100%;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:10px 10px 9px;border-radius:var(--radius-lg);border:1px solid transparent}
.prow:hover{background:var(--bg-hover)}
.prow.is-active{background:var(--bg-primary);border-color:var(--border-default);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.prow-title{font-size:12.5px;font-weight:500;line-height:1.35;color:var(--text-primary);display:block;width:100%}
.prow-meta{font-size:11px;color:var(--text-tertiary);width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%}

/* ===== PDF 区 ===== */
.pdf-col{flex:1;display:flex;flex-direction:column;position:relative;background:var(--bg-tertiary)}
.pdf-toolbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--border-subtle);background:var(--bg-primary)}
.pdf-pageinfo{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono)}
.pdf-zoom{display:flex;align-items:center;gap:2px;margin-left:auto}
.zbtn{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary)}
.zbtn:hover{background:var(--bg-hover)}
.pdf-scroll{flex:1;overflow-y:auto;position:relative;padding:18px 24px 30px}
.paper-page{max-width:640px;margin:0 auto 16px;background:var(--paper);color:var(--paper-text);border:1px solid var(--border-default);border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:30px 34px 26px;font-family:var(--font-serif);font-size:11.5px;line-height:1.66}
.pp-head{display:flex;justify-content:space-between;font-family:var(--font-body);font-size:11px;color:var(--paper-meta);margin-bottom:14px;gap:12px}
.pp-title{font-size:17px;font-weight:700;text-align:center;line-height:1.3;margin:2px 0 8px}
.pp-authors{font-size:11px;text-align:center;color:var(--paper-meta);margin-bottom:12px}
.pp-h1{font-size:13.5px;font-weight:700;margin:13px 0 5px;font-family:var(--font-serif)}
.pp-h2{font-size:12.5px;font-weight:700;margin:11px 0 4px;font-family:var(--font-serif)}
.pp-abs-label{font-weight:700;text-align:center;display:block;margin:4px 0 4px}
.two-col{column-count:2;column-gap:24px;text-align:justify;hyphens:auto}
.paper-page sup,.paper-page sub{font-size:10.5px}
.eq{font-family:var(--font-serif);font-style:italic;text-align:center;margin:9px 0;font-size:13px}
.eq .tag{font-style:normal;font-family:var(--font-body);font-size:10.5px;color:var(--paper-meta);margin-left:10px}
.eq i{font-style:italic}
.t1{border-collapse:collapse;margin:8px auto;font-family:var(--font-body);font-size:10.5px;width:100%}
.t1 th,.t1 td{border-bottom:1px solid rgba(128,128,128,.35);padding:3px 6px;text-align:center}
.t1 th{font-weight:600;border-bottom-width:1.5px}
.t1 .cap{font-size:10.5px;color:var(--paper-meta);text-align:left;display:block;margin-top:3px}
.fig2{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 4px;font-family:var(--font-body)}
.fig2 .fnode{border:1.2px solid currentColor;border-radius:5px;padding:5px 9px;font-size:10.5px;color:var(--paper-text)}
.fig2 .farr{color:var(--paper-meta);font-size:11px}
.hl{background:var(--hl-bg);border-bottom:1.5px solid var(--warning);border-radius:2px;cursor:pointer;transition:box-shadow .3s}
.hl.hl-user{background:var(--hl-user);border-bottom-color:var(--accent-light)}
.hl.is-pulse{animation:hlpulse 2.4s ease-out}
@keyframes hlpulse{0%{box-shadow:0 0 0 0 rgba(217,119,6,.55)}70%{box-shadow:0 0 0 9px rgba(217,119,6,0)}100%{box-shadow:0 0 0 0 rgba(217,119,6,0)}}
.pp-foot{display:flex;justify-content:center;font-family:var(--font-body);font-size:11px;color:var(--paper-meta);margin-top:12px}

/* PDF 状态卡（五态如实呈现） */
.pdf-state{flex:1;display:flex;align-items:center;justify-content:center;padding:30px}
.pdf-state-card{width:min(460px,92%);background:var(--bg-primary);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:30px 30px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.st-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.st-ic svg{width:22px;height:22px}
.st-title{font-size:15.5px;font-weight:600}
.st-desc{font-size:12.5px;color:var(--text-secondary);line-height:1.6;max-width:360px}
.st-btns{display:flex;gap:8px;margin-top:6px;justify-content:center;flex-wrap:wrap}
.st-src{font-size:11px;color:var(--text-tertiary);margin-top:8px;line-height:1.5}

/* ===== AI 面板（方向 A） ===== */
.ai-col{width:348px;flex:0 0 348px;border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;background:var(--bg-secondary)}
.ai-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border-subtle)}
.ai-head-title{font-size:13px;font-weight:600}
.ai-mode{font-size:11px;color:var(--text-tertiary);display:flex;align-items:center;gap:4px;margin-left:auto}
.ai-scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.msg-user{align-self:flex-end;max-width:86%;background:var(--user-bubble);color:var(--user-text);padding:8px 12px;border-radius:14px 14px 4px 14px;font-size:12.5px;line-height:1.55}
.msg-bot{max-width:100%;background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:12.5px;line-height:1.62;color:var(--text-primary)}
.msg-explain{max-width:100%;background:var(--bg-primary);border:1px solid var(--border-default);border-left:3px solid var(--accent-light);border-radius:var(--radius-md);padding:10px 12px;font-size:12.5px;line-height:1.6}
.mx-quote{font-family:var(--font-serif);font-style:italic;font-size:11.5px;color:var(--text-secondary);border-left:2px solid var(--border-strong);padding:2px 0 2px 9px;margin-bottom:7px;line-height:1.5}
.mx-cites{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cite{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);background:var(--pill-bg);border:1px solid var(--border-default);border-radius:999px;padding:2px 9px;white-space:nowrap}
.cite:hover{background:var(--accent-dim);color:var(--text-primary)}
.ai-empty{margin:auto;text-align:center;color:var(--text-tertiary);font-size:12.5px;line-height:1.7;padding:30px 20px}
.ai-empty .ic-20{margin:0 auto 8px;display:flex;width:fit-content;opacity:.7}
.ai-composer{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin:10px;padding:9px 12px;background:var(--bg-primary);border:1px solid var(--border-default);border-radius:var(--radius-lg)}
.ai-composer input{flex:1;font-size:12.5px}
.ai-composer input::placeholder{color:var(--text-muted)}
.send-btn{width:28px;height:28px;border-radius:8px;background:var(--text-primary);color:var(--bg-primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ai-hint{font-size:11px;color:var(--text-muted);padding:0 14px 10px;line-height:1.5}

/* ===== 方向 B · 论文带 + 抽屉 ===== */
.strip-wrap{flex:0 0 auto;border-bottom:1px solid var(--border-subtle);background:var(--bg-primary)}
.strip{overflow-x:auto;padding:8px 14px}
.strip-inner{display:flex;gap:8px;width:max-content;min-width:100%;align-items:center}
.chip{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--border-default);font-size:12px;color:var(--text-secondary);white-space:nowrap;flex:0 0 auto}
.chip .dot{width:6px;height:6px;border-radius:50%}
.chip.is-active{background:var(--chip-active-bg);color:var(--chip-active-fg);border-color:transparent;font-weight:500}
.chip:hover:not(.is-active){background:var(--bg-hover)}
.pdf-col--wide .paper-page{max-width:680px}
.cmdk-btn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-tertiary);border:1px solid var(--border-default);border-radius:999px;padding:5px 12px;white-space:nowrap}
.cmdk-btn:hover{background:var(--bg-hover)}
.cmdk-mask{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:flex-start;justify-content:center;padding-top:110px;z-index:30}
.cmdk{width:min(520px,92%);background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);overflow:hidden}
.cmdk-input{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--border-subtle);color:var(--text-tertiary)}
.cmdk-input input{flex:1;font-size:13.5px}
.cmdk-list{max-height:300px;overflow-y:auto;padding:6px}
.cmdk-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--radius-md)}
.cmdk-row:hover{background:var(--bg-hover)}
.cmdk-row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.ai-drawer{width:360px;flex:0 0 360px;border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;background:var(--bg-secondary)}
.ai-rail{width:34px;flex:0 0 34px;border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:10px;color:var(--text-tertiary);background:var(--bg-secondary)}
.ai-rail:hover{color:var(--text-primary);background:var(--bg-hover)}
.rail-txt{writing-mode:vertical-rl;font-size:11.5px;letter-spacing:2px}
.drawer-pin{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;color:var(--text-tertiary)}
.drawer-pin:hover{background:var(--bg-hover);color:var(--text-primary)}

/* ===== 方向 C · 大纲列 + 证据流 ===== */
.outline-col{width:242px;flex:0 0 242px;border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;background:var(--bg-secondary)}
.ol-label{font-size:11px;color:var(--text-muted);padding:12px 14px 6px}
.ol-scroll{flex:1;overflow-y:auto;padding:0 8px 14px}
.ol-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:5.5px 8px;border-radius:7px;font-size:12px;color:var(--text-secondary)}
.ol-item:hover{background:var(--bg-hover)}
.ol-item.lvl2{padding-left:24px;font-size:11.5px;color:var(--text-tertiary)}
.ol-item.has-anchor::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--warning);margin-left:auto;opacity:.85}
.ol-sep{border-top:1px solid var(--border-subtle);margin:10px 6px}
.anchor-row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:8px 9px;border-radius:var(--radius-md)}
.anchor-row:hover{background:var(--bg-hover)}
.anchor-row .a-quote{font-size:11.5px;color:var(--text-secondary);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.anchor-row .a-page{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}
.ev-col{width:376px;flex:0 0 376px;border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;background:var(--bg-secondary)}
.ev-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border-subtle)}
.ev-scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.ev-card{background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.ev-kind{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-tertiary)}
.ev-kind .kk{font-weight:500;color:var(--text-secondary)}
.ev-quote{font-family:var(--font-serif);font-style:italic;font-size:11.5px;color:var(--text-secondary);border-left:2px solid var(--border-strong);padding:2px 0 2px 9px;line-height:1.5}
.ev-text{font-size:12.5px;line-height:1.62}
.ev-fx{width:100%;background:var(--pill-bg);border:1px dashed var(--border-strong);border-radius:var(--radius-md);padding:8px 10px;font-family:var(--font-serif);font-style:italic;font-size:12.5px;text-align:center}
.ev-flag{font-size:11px;color:var(--warning);display:inline-flex;align-items:center;gap:4px}
.ev-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.ev-mini{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-secondary);border:1px solid var(--border-default);border-radius:999px;padding:3.5px 10px}
.ev-mini:hover{background:var(--bg-hover)}
.ev-note{font-size:11.5px;color:var(--text-tertiary);line-height:1.5}

/* ===== 划词浮条 / toast / 评审条 ===== */
#selpop{position:fixed;z-index:60;display:flex;gap:2px;padding:3px;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-pop)}
#selpop[hidden]{display:none}
.selp-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;border-radius:7px;color:var(--text-secondary);white-space:nowrap}
.selp-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:70;background:var(--text-primary);color:var(--bg-primary);font-size:12.5px;padding:9px 16px;border-radius:10px;box-shadow:var(--shadow-pop);max-width:min(560px,86vw)}
#toast[hidden]{display:none}
#rbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--bg-elevated);border-top:1px solid var(--border-default);flex-wrap:wrap;width:max-content;max-width:100vw;margin-left:auto;margin-right:auto;border-left:1px solid var(--border-subtle);border-right:1px solid var(--border-subtle);border-radius:12px 12px 0 0;bottom:0}
.rbar-dirs{display:flex;gap:4px;background:var(--bg-tertiary);border-radius:10px;padding:3px}
.rbar-dir{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 12px;border-radius:8px;color:var(--text-secondary);white-space:nowrap}
.rbar-dir:hover{color:var(--text-primary)}
.rbar-dir.is-active{background:var(--bg-primary);color:var(--text-primary);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rbar-dir .kbd{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);border:1px solid var(--border-default);border-radius:4px;padding:0 4px}
.rbar-cost{font-size:11.5px;color:var(--text-tertiary);line-height:1.45;white-space:normal;max-width:430px}
.rbar-cost b{color:var(--text-secondary);font-weight:500}
.rbar-keys{font-size:11px;color:var(--text-muted);margin-left:auto;white-space:nowrap}
.rbar-theme{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;color:var(--text-secondary);border:1px solid var(--border-default)}
.rbar-theme:hover{background:var(--bg-hover)}

/* 顶部说明条 */
.banner{flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;padding:9px 16px;background:var(--accent-dim);border-bottom:1px solid var(--border-subtle);font-size:12px;color:var(--text-secondary);line-height:1.55}
.banner b{color:var(--text-primary);font-weight:500}
.banner-x{margin-left:auto;color:var(--text-tertiary);flex:0 0 auto;padding:2px}
.banner-x:hover{color:var(--text-primary)}

/* 打字光标 */
.typing-caret::after{content:'▍';color:var(--text-tertiary);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="main"><div id="stage"></div></div>
</div>
<div id="selpop" hidden></div>
<div id="toast" hidden></div>
<div id="rbar"></div>

<script>
'use strict';
/* ================= 图标（lucide 风格线性，stroke 1.7） ================= */
const P={

hl:'<path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>',

clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

bot:'<rect x="4" y="8" width="16" height="12" rx="2"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

function ic(n,cls){return '<span class="ic'+(cls?' '+cls:'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[n]||P.file)+'</svg></span>';}

/* ================= 数据 ================= */
const STATUS={
  available:{label:'全文可读',dot:'var(--success)',ic:'check'},
  publisher_link_only:{label:'仅出版社页',dot:'var(--accent)',ic:'ext'},
  no_oa_found:{label:'未收录全文',dot:'var(--text-muted)',ic:'ban',ghost:1},
  fetch_failed:{label:'获取失败 · 可重试',dot:'var(--warning)',ic:'refresh'},
  restricted:{label:'需上传 PDF',dot:'var(--accent)',ic:'lock',solid:1},
};
const PAPERS=[
 {id:'attention',title:'Attention Is All You Need',authors:'Vaswani et al. · Google Brain / Google Research / U. Toronto',year:2017,venue:'NeurIPS 2017 · arXiv:1706.03762',status:'available',kg:'引文支持',sha:'9f2a41c7e8b3d605',full:true,
  abs:'The dominant sequence transduction models are based on complex recurrent or convolutional neural networks that include an encoder and a decoder. We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely. Experiments on two machine translation tasks show these models to be superior in quality while being more parallelizable and requiring significantly less time to train.'},
 {id:'resnet',title:'Deep Residual Learning for Image Recognition',authors:'He, Zhang, Ren, Sun · Microsoft Research',year:2015,venue:'CVPR 2016 · arXiv:1512.03385',status:'available',kg:'仅题名',sha:'3c8e02b1a4f79d66',
  abs:'Deeper neural networks are more difficult to train. We present a residual learning framework to ease the training of networks that are substantially deeper than those used previously. We explicitly reformulate the layers as learning residual functions with reference to the layer inputs. We provide comprehensive empirical evidence showing that these residual networks are easier to optimize, and can gain accuracy from considerably increased depth.'},
 {id:'gpt3',title:'Language Models are Few-Shot Learners',authors:'Brown et al. · OpenAI',year:2020,venue:'NeurIPS 2020 · arXiv:2005.14165',status:'available',kg:'仅题名',sha:'b71d9e2043ca85f2',
  abs:'We train GPT-3, an autoregressive language model with 175 billion parameters, 10x more than any previous non-sparse language model, and test its performance in the few-shot setting. Across tasks GPT-3 achieves promising results with no gradient updates or fine-tuning, sometimes competitive with and occasionally surpassing prior state-of-the-art fine-tuned approaches.'},
 {id:'elsevier',title:'Adaptive Retrieval for Knowledge-Intensive Tasks',authors:'Chen, Ouyang · 2023',year:2023,venue:'Data & Knowledge Engineering (Elsevier)',status:'publisher_link_only',kg:'仅题名'},
 {id:'acm',title:'Curriculum Scheduling in Embodied Agents',authors:'Wu, Ilic · 2021',year:2021,venue:'ACM Trans. on Human-Robot Interaction',status:'no_oa_found',kg:'仅题名'},
 {id:'timeout',title:'Sparse Mixture-of-Experts Routing',authors:'Kaplan, Nado · 2024',year:2024,venue:'OA 源（ACM DL）· 重试 3 次超时',status:'fetch_failed',kg:'未核验'},
 {id:'nature',title:'Protein Complex Assembly at Scale',authors:'Ferruz, Schmidt · 2022',year:2022,venue:'Nature（出版社版权）',status:'restricted',kg:'仅题名'},
];
const STATUS_CARD={
  publisher_link_only:{ic:'ext',tone:'var(--accent)',title:'未获取到全文 PDF',
    desc:'OpenAlex 与 Semantic Scholar 均未提供开放获取 PDF，仅找到出版社落地页。系统不会伪装已有全文 —— 你可以先访问出版社页面确认，或上传自己有权使用的 PDF。',
    btns:[{t:'访问出版社页面',act:'ext',ink:1},{t:'上传 PDF',act:'upload'}]},
  no_oa_found:{ic:'ban',tone:'var(--text-muted)',title:'未收录全文（no_oa_found）',
    desc:'已按优先级查询 arXiv / OpenAlex best_oa_location / Semantic Scholar openAccessPdf，均无开放获取版本。这是真实不存在，不是获取失败 —— 两类状态在系统里永远分开呈现。',
    btns:[{t:'上传 PDF',act:'upload',ink:1}]},
  fetch_failed:{ic:'refresh',tone:'var(--warning)',title:'获取失败（fetch_failed）',
    desc:'确认存在 OA 全文（arXiv 镜像），但下载连接 3 次超时。失败与不存在是两回事：这条状态可重试，明天会自动再试一次。',
    btns:[{t:'重试获取',act:'retry',ink:1},{t:'上传 PDF',act:'upload'}]},
  restricted:{ic:'lock',tone:'var(--accent)',title:'受限获取（restricted）',
    desc:'该论文在出版社版权限制内，机构订阅之外无法合法自动获取。可以挂接机构代理后重试，或直接上传你有权使用的 PDF。',
    btns:[{t:'挂机构代理重试',act:'retry'},{t:'上传 PDF',act:'upload',ink:1}]},
};
const Q_A={
 q:'为什么要除以 √d<sub>k</sub>？',
 html:true,
 a:'当键向量维度 d<sub>k</sub> 增大时，点积 q·k 的方差随 d<sub>k</sub> 线性变大，softmax 容易被推进梯度极小的饱和区。除以 √d<sub>k</sub> 把方差归一回 O(1)，缓解饱和与梯度消失。原文 §3.2.1 明确写了这一动机：To counteract this effect, we scale the dot products by 1/√d<sub>k</sub>.',
 cites:[{page:4,label:'p.4 §3.2.1',anchor:'hl-scaling'},{page:4,label:'p.4 Eq.(1)'},{page:8,label:'p.8 App. A'}],
};
const GENERIC_EXPLAIN='该段落位于 §3.2，讨论注意力机制的设计动机。结合上下文：作者先说明点积注意力的计算方式，再解释缩放因子的必要性 —— 这是理解后续 Multi-Head 设计的前置概念。（原型演示文案；真实实现由 PaperQA2 在全文索引上检索证据后作答，每条结论附页码定位。）';
const SCALING_EXPLAIN='这句是缩放点积注意力的核心动机：当 d<sub>k</sub> 较大时，q 与 k 的点积是 d<sub>k</sub> 个独立项之和，方差随维度线性增长，大量分量进入 softmax 饱和区后梯度趋近于零。除以 √d<sub>k</sub> 将方差归一，保证训练初期梯度健康。Table 1 里自注意力 O(1) 的最大路径长度也依赖这一数值稳定性。';
function explainFor(quote){return /suspect|scale|gradient|dék|dₖ/i.test(quote)?SCALING_EXPLAIN:GENERIC_EXPLAIN;}
const FOLLOWUP_A='（原型演示）真实实现里，这类追问会由研究 Agent 调用 PaperQA2 在全文索引上检索证据后回答，并像上一条一样给出可点击的页码引用；证据会进入统一 EvidenceRef 协议。';

/* 消息与证据（按论文隔离会话） */
const S={
  dir:'C',theme:'light',paper:'attention',drawerOpen:false,cmdk:false,cmdkQ:'',banner:true,notes:0,
  msgs:{attention:[{role:'user',text:Q_A.q,html:Q_A.html},{role:'assistant',text:Q_A.a,cites:Q_A.cites,html:true}]},
  evidence:[
    {kind:'qa',q:'Table 1 的最大路径长度对比说明什么？',text:'自注意力的最大路径长度是 O(1)，循环层是 O(n)。路径越短，长程依赖越容易学习；这也是 Table 1 里自注意力在并行度与路径长度两项同时占优的含义。',cites:[{page:3,label:'p.3 Table 1',anchor:null}],time:'16:42'},
    {kind:'explain',quote:'To counteract this effect, we scale the dot products by 1/√d<sub>k</sub>.',html:true,text:SCALING_EXPLAIN,cites:[{page:4,label:'p.4 §3.2.1',anchor:'hl-scaling'}],time:'16:39'},
    {kind:'formula',fx:'MultiHead(Q,K,V) = Concat(head₁…head₈)Wᴼ',text:'视觉模型解析：8 个头并行投影到 d_k = d_v = 64 的子空间，输出拼接后经 Wᴼ 变换回 d_model = 512；总计算量与单头全维注意力相当。',flag:'需视觉模型 · 未配置时如实降级',cites:[{page:4,label:'p.4 Eq.(1)',anchor:null}],time:'16:35'},
  ],
};
let TYPERS=[];

/* ================= 小工具 ================= */
const q=(s,el)=> (el||document).querySelector(s);
const qa=(s,el)=> Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const paper=()=>PAPERS.find(p=>p.id===S.paper);
function toast(t){const el=q('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{el.hidden=true;},2200);}
function clearTypers(){TYPERS.forEach(clearInterval);TYPERS=[];}
function typewrite(el,full){
  if(!el)return;
  const plain=full.replace(/<[^>]+>/g,'');
  let i=0;el.classList.add('typing-caret');
  const iv=setInterval(()=>{
    i+=3;
    if(i<plain.length){el.textContent=plain.slice(0,i);}
    else{el.innerHTML=full;el.classList.remove('typing-caret');clearInterval(iv);}
  },26);
  TYPERS.push(iv);
}
function goPage(page,anchor){
  const sc=q('.pdf-scroll');if(!sc){toast('当前方向没有阅读区');return;}
  const pg=sc.querySelector('[data-page="'+page+'"]');
  if(!pg){toast('原型仅内置这篇论文的第 1 / 3 / 4 页演示页面');return;}
  sc.scrollTo({top:pg.offsetTop-14,behavior:'smooth'});
  if(anchor){const a=sc.querySelector('#'+anchor);if(a){a.classList.remove('is-pulse');void a.offsetWidth;a.classList.add('is-pulse');setTimeout(()=>a.classList.remove('is-pulse'),2600);}}
}

/* ================= 组件片段 ================= */
function stBadge(p){const s=STATUS[p.status];return '<span class="st'+(s.ghost?' st--ghost':'')+(s.solid?' st--solid':'')+'" data-state="'+p.status+'"><span class="dot" style="background:'+(s.ghost?'transparent;border:1.5px solid var(--text-muted)':s.dot)+'"></span>'+s.label+'</span>';}
function kgBadge(p){return '<span class="kg-pill">'+ic('net','ic-13')+'图谱：<b>'+p.kg+'</b></span>';}
function headActions(p){
  const b=[];
  if(p.status==='available'){b.push('<span class="sha" title="SHA-256 前缀，版本化引用的基础">sha256:'+p.sha+'</span>');b.push('<button class="btn" data-act="ext">'+ic('ext','ic-13')+'arXiv</button>');}
  if(p.status==='publisher_link_only'){b.push('<button class="btn" data-act="ext">'+ic('ext','ic-13')+'出版社页</button>');b.push('<button class="btn btn--ink" data-act="upload">'+ic('upload','ic-13')+'上传 PDF</button>');}
  if(p.status==='no_oa_found'){b.push('<button class="btn btn--ink" data-act="upload">'+ic('upload','ic-13')+'上传 PDF</button>');}
  if(p.status==='fetch_failed'){b.push('<button class="btn" data-act="retry">'+ic('refresh','ic-13')+'重试</button>');b.push('<button class="btn" data-act="upload">'+ic('upload','ic-13')+'上传</button>');}

function page1(p){
  return '<article class="paper-page" data-page="1"><div class="pp-head"><span>'+esc(p.venue)+'</span><span>p. 1</span></div>'+

  '<div class="pp-h1">1&nbsp;&nbsp;Introduction</div><div class="two-col"><p>Deep learning has driven progress in tasks across modalities; the central question of this work is how structural choices determine what a model can learn efficiently. In the sections that follow, we describe the motivation and the resulting architecture.</p></div>'+
  '<div class="pp-foot">1</div></article>';
}
function page3(){
  return '<article class="paper-page" data-page="3"><div class="pp-head"><span>NIPS 2017</span><span>Attention Is All You Need · p. 3</span></div>'+
  '<div class="pp-h1">3&nbsp;&nbsp;Model Architecture</div>'+
  '<div class="two-col"><p>Most competitive neural sequence transduction models have an encoder-decoder structure. Here, the encoder maps an input sequence of symbol representations to a sequence of continuous representations, which the decoder then generates an output sequence of symbols one element at a time.</p>'+
  '<table class="t1"><tr><th>Layer Type</th><th>Complexity / Layer</th><th>Sequential Ops</th><th>Max Path Length</th></tr>'+
  '<tr><td>Self-Attention</td><td>O(n²·d)</td><td>O(1)</td><td>O(1)</td></tr>'+
  '<tr><td>Recurrent</td><td>O(n·d²)</td><td>O(n)</td><td>O(n)</td></tr>'+
  '<tr><td>Convolutional</td><td>O(k·n·d²)</td><td>O(1)</td><td>O(log_k(n))</td></tr>'+
  '</table><span class="t1 cap">Table 1: Maximum path lengths, per-layer complexity and minimum number of sequential operations for different layer types.</span></div>'+
  '<div class="pp-h2">3.2&nbsp;&nbsp;Attention</div>'+
  '<div class="two-col"><p>An attention function can be described as mapping a query and a set of key-value pairs to an output, where the query, keys, values and output are all vectors. The output is computed as a weighted sum of the values, where the weight assigned to each value is computed by a compatibility function of the query with the corresponding key.</p></div>'+
  '<div class="eq">Attention(<i>Q, K, V</i>) = softmax(<i>QK</i><sup>T</sup> / √<i>d</i><sub>k</sub>)<i>V</i><span class="tag">(1)</span></div>'+
  '<div class="pp-foot">3</div></article>';
}
function page4(){
  return '<article class="paper-page" data-page="4"><div class="pp-head"><span>NIPS 2017</span><span>Attention Is All You Need · p. 4</span></div>'+
  '<div class="pp-h2">3.2.1&nbsp;&nbsp;Scaled Dot-Product Attention</div>'+
  '<p>We call our particular attention Scaled Dot-Product Attention. The input consists of queries and keys of dimension <i>d</i><sub>k</sub>, and values of dimension <i>d</i><sub>v</sub>. We compute the dot products of the query with all keys, divide each by √<i>d</i><sub>k</sub>, and apply a softmax function to obtain the weights on the values.</p>'+
  '<div class="fig2"><span class="fnode">MatMul</span><span class="farr">→</span><span class="fnode">Scale</span><span class="farr">→</span><span class="fnode">Mask (opt.)</span><span class="farr">→</span><span class="fnode">SoftMax</span><span class="farr">→</span><span class="fnode">MatMul</span></div>'+
  '<div class="two-col" style="margin-top:8px"><p><span class="hl" id="hl-scaling" title="AI 引用锚 · p.4 §3.2.1">We suspect that for large values of <i>d</i><sub>k</sub>, the dot products grow large in magnitude, pushing the softmax function into regions where it has extremely small gradients. To counteract this effect, we scale the dot products by 1/√<i>d</i><sub>k</sub>.</span> The scaling factor keeps the variance of the dot products stable across dimensions.</p>'+
  '<p>Multi-head attention allows the model to jointly attend to information from different representation subspaces at different positions. With a single attention head, averaging inhibits this.</p></div>'+
  '<div class="pp-h2">3.2.2&nbsp;&nbsp;Multi-Head Attention</div>'+
  '<div class="two-col"><p>Instead of performing a single attention function with <i>d</i><sub>model</sub>-dimensional keys, values and queries, we found it beneficial to linearly project the queries, keys and values <i>h</i> times with different, learned linear projections.</p></div>'+
  '<div class="pp-foot">4</div></article>';
}

  '<button class="selp-btn" data-sact="fq">'+ic('msg','ic-13')+'追问</button>'+
  '<button class="selp-btn" data-sact="note">'+ic('bookmark','ic-13')+'批注</button>';
  pop.hidden=false;
  const L=Math.max(8,Math.min(rect.left,window.innerWidth-250));
  let T=rect.bottom+8;
  if(T+44>window.innerHeight-92)T=rect.top-46;
  pop.style.left=L+'px';pop.style.top=T+'px';
}
pop.addEventListener('mousedown',e=>e.preventDefault());
pop.addEventListener('click',e=>{
  const b=e.target.closest('[data-sact]');if(!b)return;
  const sel=window.getSelection();const txt=sel?sel.toString().trim():'';
  const act=b.getAttribute('data-sact');
  if(act==='ex')insertExplain(txt);
  if(act==='fq')insertFollowup(txt);
  if(act==='note'){
    try{const r=sel.getRangeAt(0);const span=document.createElement('span');span.className='hl hl-user';r.surroundContents(span);}catch(err){/* 跨节点选区不强制包裹 */}
    addNote(txt);
  }
  hidePop();if(sel)sel.removeAllRanges();
});
document.addEventListener('mouseup',e=>{
  if(pop.contains(e.target))return;
  setTimeout(()=>{
    const sel=window.getSelection();
    if(!sel||!sel.rangeCount){hidePop();return;}
    const txt=sel.toString().trim();
    let node=sel.anchorNode;if(node&&node.nodeType===3)node=node.parentElement;
    const inPaper=node&&node.closest&&node.closest('.paper-page');
    if(txt.length>2&&txt.length<800&&inPaper){showPopAt(sel.getRangeAt(0).getBoundingClientRect());}
    else hidePop();
  },10);
});
document.addEventListener('scroll',hidePop,true);
/* 事件委托：挂在 document —— #rbar 在 #stage 之外，绑 stage 会漏掉评审条按钮（方向/主题切换失效） */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.getAttribute('data-act');
  if(act==='dir'){S.dir=el.getAttribute('data-dir');render();}
  if(act==='theme'){S.theme=S.theme==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;render();}
  if(act==='banner-close'){S.banner=false;render();}
  if(act==='sel-paper'){S.paper=el.getAttribute('data-id');S.cmdk=false;render();}
  if(act==='cite'){goPage(+(el.getAttribute('data-page')||4),el.getAttribute('data-anchor'));}
  if(act==='go-page'){goPage(+(el.getAttribute('data-page')||1));}
  if(act==='ext')toast('原型不外跳 —— 真实实现新开出版社 / arXiv 落地页');
  if(act==='upload')toast('上传入口：真实实现接 paper-reader /upload 端点（校验 %PDF- 魔数 + SHA-256 落库）');
  if(act==='retry')toast('重试获取：走 SSRF 加固的私有 opener（禁环境代理 · 重定向上限 · 大小上限）');
  if(act==='zoom')toast('缩放：react-pdf-highlighter-extended 自带，原型略');
  if(act==='drawer'){S.drawerOpen=!S.drawerOpen;render();}
  if(act==='pin'){S.drawerOpen=false;render();}
  if(act==='cmdk'){S.cmdk=true;S.cmdkQ='';render();}
  if(act==='cmdk-close'){S.cmdk=false;render();}
  if(act==='cmdk-pick'){S.paper=el.getAttribute('data-id');S.cmdk=false;render();}
  if(act==='send')sendAsk();
  if(act==='tab')toast('本原型聚焦「原文阅读」—— 对话 / 论文库与图谱已是上线功能');
  if(act==='kg')toast('关联图谱断言：P4 范围 —— 阅读侧栏联动 KG 候选断言');
  if(act==='save')toast('已写入研究笔记（P4：自动生成研究上下文）');
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Escape'&&S.cmdk){S.cmdk=false;render();}return;}
  if(e.key==='1'||e.key==='2'||e.key==='3'){S.dir=['A','B','C'][+e.key-1];render();}
  if(e.key==='d'||e.key==='D'){S.theme=S.theme==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;render();}
  if(e.key==='Escape'){if(S.cmdk){S.cmdk=false;render();}else hidePop();}
});

/* 探针接口 */
window.__probe={
  get dir(){return S.dir;},get theme(){return S.theme;},get paper(){return S.paper;},
  states:()=>qa('.st[data-state]').map(e=>e.getAttribute('data-state')),
  msgCount:()=>qa('.ai-scroll .msg,.ev-scroll .ev-card').length,
  lastText:()=>{const el=qa('.msg-text,[data-full]').pop();return el?(el.textContent||''):'';},
  pdfScroll:()=>{const s=q('.pdf-scroll');return s?{top:s.scrollTop,h:s.scrollHeight}:null;},
  hlVisible:()=>{const h=q('#hl-scaling');if(!h)return false;const r=h.getBoundingClientRect();return r.width>0&&r.height>0;},
  drawerWidth:()=>{const d=q('.ai-drawer');return d?d.getBoundingClientRect().width:0;},
  railWidth:()=>{const r=q('.ai-rail');return r?r.getBoundingClientRect().width:0;},
  evCount:()=>S.evidence.length,
  citeCount:()=>qa('.cite').length,
  clickable:()=>qa('#stage button,[role=button],input').filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0;}).length,
};
