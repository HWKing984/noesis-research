<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3e9">
  <title>湖边慢骑 · 熊猫的好天气</title>
  <style>
    :root { color-scheme: light; --ink: #30463d; --muted: #7b897e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f4f3e9; color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    main { width: min(1180px, calc(100% - 64px)); padding: 38px 0 28px; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    header { margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { width: 38px; height: 38px; }
    .eyebrow { margin: 0 0 5px; font-size: 10px; letter-spacing: .24em; color: var(--muted); }
    h1 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: .13em; }
    .weather { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 9px; }
    .weather svg { width: 19px; height: 19px; }
    .postcard { position: relative; overflow: hidden; border-radius: 24px; background: #e6efe1; box-shadow: 0 18px 48px #324a3510; }
    .landscape { display: block; width: 100%; height: auto; }
    .scene-label { position: absolute; left: 4.5%; top: 7%; pointer-events: none; }
    .scene-label p { margin: 0 0 12px; font-size: clamp(8px, 1vw, 12px); letter-spacing: .28em; color: #6d897d; }
    .scene-label h2 { margin: 0; font-family: "Songti SC", "SimSun", serif; font-size: clamp(22px, 3.3vw, 43px); font-weight: 400; letter-spacing: .12em; line-height: 1.6; }
    .stamp { position: absolute; right: 4%; bottom: 5%; font-size: 10px; color: #536c55; letter-spacing: .19em; writing-mode: vertical-rl; }
    footer { padding: 21px 4px 0; }
    .caption { margin: 0; font-size: 13px; letter-spacing: .08em; }
    .caption span { color: var(--muted); margin-right: 12px; font-size: 10px; letter-spacing: .18em; }
    button { display: inline-flex; align-items: center; gap: 9px; flex-shrink: 0; border: 1px solid #ccd3c8; border-radius: 30px; padding: 10px 17px; font: inherit; font-size: 11px; color: var(--ink); background: transparent; cursor: pointer; }
    button:hover { background: #e6ebdf; }
    button:focus-visible { outline: 2px solid #50745d; outline-offset: 4px; }
    button svg { width: 12px; height: 12px; }
    .play-icon { display: none; }
    .paused .pause-icon { display: none; }
    .paused .play-icon { display: block; }
    .wheel-spokes { transform-box: fill-box; transform-origin: center; animation: spin 3s linear infinite; }
    .rider { animation: ride 1.5s ease-in-out infinite; }
    .scarf-tail { transform-box: fill-box; transform-origin: right center; animation: flutter 1.5s ease-in-out infinite; }
    .cloud { animation: drift 16s ease-in-out infinite alternate; }
    .cloud.far { animation-duration: 23s; animation-direction: alternate-reverse; }
    .water-glint { animation: glint 4s ease-in-out infinite; }
    .water-glint.late { animation-delay: -2s; }
    .duck { animation: bob 3s ease-in-out infinite; }
    .paused .animated { animation-play-state: paused; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ride { 50% { transform: translateY(-3px); } }
    @keyframes flutter { 50% { transform: rotate(-6deg) scaleY(.9); } }
    @keyframes drift { to { transform: translateX(34px); } }
    @keyframes glint { 50% { opacity: .35; } }
    @keyframes bob { 50% { transform: translateY(3px); } }
    @media (max-width: 640px) {
      main { width: calc(100% - 28px); padding: 24px 0; }
      header { margin-bottom: 18px; gap: 10px; }
      h1 { font-size: 16px; }
      .brand { gap: 8px; }
      .brand-icon { width: 32px; height: 32px; }
      .weather { font-size: 10px; gap: 5px; }
      .weather .weather-text { display: none; }
      .postcard { border-radius: 16px; }
      .scene-label p { margin-bottom: 5px; }
      .scene-label h2 { font-size: clamp(17px, 4.5vw, 26px); }
      .stamp { font-size: 7px; }
      footer { align-items: flex-start; padding-top: 17px; gap: 10px; }
      .caption { font-size: 11px; line-height: 1.8; }
      .caption span { display: block; font-size: 8px; }
      button { padding: 9px 12px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { .animated { animation: none; } }
  </style>
</head>

  <script>
    const button = document.getElementById('motion-toggle');
    const label = document.getElementById('motion-label');
    button.addEventListener('click', () => {
      const paused = document.body.classList.toggle('paused');
      button.setAttribute('aria-pressed', String(paused));
      button.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
      label.textContent = paused ? '继续兜风' : '暂停一下';
    });
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      button.hidden = true;
      button.style.display = 'none';
    }
    // Open with #self-check to verify that the control actually stops the animation.
    if (location.hash === '#self-check') {
      button.click();
      if (button.getAttribute('aria-pressed') !== 'true' ||
          getComputedStyle(document.querySelector('.rider')).animationPlayState !== 'paused') {
        throw new Error('Pause control failed');
      }
      button.click();
      if (document.body.classList.contains('paused') || label.textContent !== '暂停一下') {
        throw new Error('Resume control failed');
      }
      document.body.dataset.check = 'passed';
    }
  </script>
