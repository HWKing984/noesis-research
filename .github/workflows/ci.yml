name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: deepagents / paper-qa both declare >=3.11.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No `pip install` in this job: integrations/ and packages/ are
      # standard-library only on purpose — a dependency tree there would be
      # inherited by the agent tool layer.
      - name: Syntax gate
        run: python -m compileall -q integrations packages tests scripts apps

      - name: Offline suites must run; dependency suites must skip cleanly
        run: python scripts/run_all_tests.py --require adapter,contracts --expect-skip api,agent,live

  api:
    name: api (real fastapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt

      # `--require api` fails if the API suite skips, so a broken import can
      # never masquerade as a green build.
      - name: HTTP tests against the real app
        run: python scripts/run_all_tests.py --require api

      - name: Upload openapi schema
        run: python -c "import json,sys;sys.path.insert(0,'apps/api');from noesis_research_api.app import create_app;open('openapi.json','w').write(json.dumps(create_app().openapi(),ensure_ascii=False,indent=2))"

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  agent:
    name: research agent (real deepagents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install agent dependencies
        run: python -m pip install -r services/research-agent/requirements.txt

      # Also asserts the "no host shell" posture: the suite checks that the
      # backend is an in-memory StateBackend and not a sandbox backend.
      - name: Agent tool-surface and safety tests
        run: python scripts/run_all_tests.py --require agent

  web:
    name: research workspace (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install (locked)
        working-directory: apps/web
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Evidence-rule unit tests
        working-directory: apps/web
        run: pnpm test

      - name: Production build
        working-directory: apps/web
        run: pnpm build

      # NOTE: the CDP browser verification (apps/web/tools/verify_ui.mjs) is a
      # local / pre-deploy gate, not a CI step: it asserts against a live API and
      # a real Neo4j. Running it here without a graph would prove nothing.

